# Demo: simulated bottling line + mcp-opcua in READ-ONLY mode (streamable HTTP on :8000).
services:
  sim:
    build: .
    command: ["sim", "--endpoint", "opc.tcp://0.0.0.0:4840/bottling/"]
    ports: ["127.0.0.1:4840:4840"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 4840), 2)"]
      interval: 2s
      retries: 15

  mcp:
    build: .
    command: ["serve", "--config", "/config/config.yaml", "--transport", "streamable-http", "--host", "0.0.0.0"]
    depends_on:
      sim: { condition: service_healthy }
    volumes:
      - ./examples/config.compose.yaml:/config/config.yaml:ro
    ports: ["127.0.0.1:8000:8000"]  # no auth in v0.1: loopback only
